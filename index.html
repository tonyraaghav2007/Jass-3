<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jass ❤️</title>
  
  <!-- iPhone 12 & Mobile Viewport Optimization -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jass ❤️">
  <meta name="theme-color" content="#000000">

  <!-- Google Fonts: Plus Jakarta Sans for ultra-crisp bold typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient Subtle Romantic Aura -->
  <canvas id="ambientCanvas" class="ambient-canvas"></canvas>

  <!-- Viewer Container: Pure Image Only, Zero UI -->
  <main class="image-stage" id="imageStage">
    <div class="canvas-container" id="canvasContainer">
      <canvas id="mainCanvas" class="main-canvas"></canvas>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
